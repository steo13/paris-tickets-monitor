name: Monitor prenotazioni musei Parigi

on:
  schedule:
    # Ogni 4 ore. Sintassi cron: minuto ora giorno mese giorno-settimana (UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # ti permette anche di lanciarlo a mano dalla tab "Actions"

permissions:
  contents: write   # serve per poter salvare state.json nel repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Esegui il monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva lo stato aggiornato nel repo
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Aggiorna stato monitoraggio"
          git push
